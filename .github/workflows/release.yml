name: Build and publish installer

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check whether this version is already released
        id: release_check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content "./Cr34teLightPatchBuilder/Cr34teLightPatchBuilder.csproj"
          $version = $project.Project.PropertyGroup.Version | Select-Object -First 1
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "The application version must be numeric (for example 1.0.5); found '$version'."
          }

          $tag = "v$version"
          $releasedTags = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName --jq '.[].tagName'
          if ($LASTEXITCODE -ne 0) {
            throw "Could not query GitHub Releases (exit code $LASTEXITCODE)."
          }

          if ($releasedTags -contains $tag) {
            Write-Host "Release $tag already exists; nothing to publish."
            "publish=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "publish=true" >> $env:GITHUB_OUTPUT

      - name: Build application and installer
        if: steps.release_check.outputs.publish == 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.release_check.outputs.version }}"
          ./build.ps1 -Version $version

      - name: Publish GitHub release
        if: steps.release_check.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.release_check.outputs.version }}"
          $tag = "v$version"
          gh release create $tag `
            "./artifacts/installer/CR34TE-Light-Patch-Builder-Setup.msi" `
            --title "CR34TE Light Patch Builder $version" `
            --notes "Fixed Art-Net node IP and Node Port Address calculations, and cleaned channel-range prefixes from fixture names while retaining useful model numbers." `
            --target $env:GITHUB_SHA
